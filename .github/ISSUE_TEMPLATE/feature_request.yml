name: Feature request
description: Suggest an improvement or new capability
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues and pull requests before opening a new request.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem would this feature solve?
      placeholder: I need to...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior or API you would like.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe workarounds or alternative approaches you have considered.

  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility and security considerations
      description: Explain any MCP, CLI, filesystem, command-execution, or security implications.

  - type: textarea
    id: additional
    attributes:
      label: Additional context
