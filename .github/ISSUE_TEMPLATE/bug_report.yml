name: Bug report
description: Report a reproducible problem with agent-dir
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues first. Do not include tokens, credentials, private URLs, or other secrets.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
      placeholder: Tell us what happened...
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Give the smallest set of steps that reproduces the problem.
      placeholder: |
        1. Run ...
        2. Configure ...
        3. Connect ...
        4. Observe ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: agent-dir version
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: "24.x"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Ubuntu 24.04 / macOS / Windows"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste relevant logs. Remove tokens, credentials, private paths, and sensitive request data.
      render: text

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add MCP client details, configuration shape, or other context that helps reproduce the issue. Do not include secrets.
